# Streamlit settings for this app (read automatically by `streamlit run`).
[theme]
base = "light"
primaryColor = "#111111"            # black buttons, sliders and focus outlines
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F6"
textColor = "#111111"
font = "sans serif"

[client]
toolbarMode = "minimal"             # hide the developer menu from staff

[browser]
gatherUsageStats = false
